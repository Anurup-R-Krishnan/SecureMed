name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "securemed-backend/**"
  pull_request:
    branches: [main]
    paths:
      - "securemed-backend/**"

defaults:
  run:
    working-directory: ./securemed-backend

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: securemed_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: securemed-backend/requirements.txt

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Run test suite
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: securemed_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          REDIS_URL: redis://localhost:6379/0
        run: pytest --tb=short

      - name: Build Docker image
        working-directory: .
        run: |
          docker build \
            -f securemed-backend/Dockerfile \
            -t securemed-backend:latest \
            ./securemed-backend
