services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    environment:
      POSTGRES_DB: ${DB_NAME:-securemed}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securemed_db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    command: redis-server --requirepass ${REDIS_PASSWORD:-securemed_redis}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-securemed_redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    environment:
      NEO4J_AUTH: neo4j/securemed_graph
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p securemed_graph \"RETURN 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./securemed-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "8000:8000"
    volumes:
      - ./securemed-backend:/app
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-securemed}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-securemed_db_password}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://:${REDIS_PASSWORD:-securemed_redis}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-securemed_redis}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: securemed_graph
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      SECRET_KEY: ${SECRET_KEY:-ci-secret-key}
      DEBUG: ${DEBUG:-False}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./securemed-frontend
      target: runner
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "3000:8080"
    environment:
      NEXT_PUBLIC_API_URL: /api
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
  backend_static:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
