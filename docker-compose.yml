# ──────────────────────────────────────────────
# SecureMed Docker Compose
# Backend (Django) · Frontend (Next.js) · PostgreSQL
# ──────────────────────────────────────────────
# Usage:
#   docker compose up --build              # first run (auto-migrates)
#   docker compose up --build -d           # detached
#   SEED_DB=true docker compose up --build # seed sample data
#   docker compose down -v                 # tear down + delete volumes
# ──────────────────────────────────────────────

services:
  # ── PostgreSQL ─────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: securemed-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: securemed
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securemed_db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securemed"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Django Backend API ─────────────────────
  backend:
    build:
      context: ./securemed-backend
      dockerfile: Dockerfile
      network: host
    container_name: securemed-backend
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-dev-key-change-in-prod}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=securemed
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-securemed_db_password}
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,0.0.0.0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000,http://localhost:80,http://localhost
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-docker-dev-encryption-key-change-in-prod}
      - SEED_DB=${SEED_DB:-false}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
      - GUNICORN_TIMEOUT=120
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media

  # ── Next.js Frontend ───────────────────────
  frontend:
    build:
      context: ./securemed-frontend
      dockerfile: Dockerfile
      network: host
      args:
        - NEXT_PUBLIC_API_URL=/api
        - BACKEND_URL=http://backend:8000
    container_name: securemed-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
      - HOSTNAME=0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ── Nginx Reverse Proxy (production profile) ──
  nginx:
    image: nginx:alpine
    container_name: securemed-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_static:/var/www/static:ro
      - backend_media:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    profiles:
      - production

volumes:
  postgres_data:
  backend_static:
  backend_media:
