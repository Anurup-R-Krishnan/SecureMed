services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-securemed}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securemed_db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-securemed_graph}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-securemed_graph}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    command: sh -c "mkdir -p /tmp/staticfiles /app/media && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 120 --workers 8 --worker-class gthread --threads 2"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      AUTO_SEED_INFECTION_TRACKING: ${AUTO_SEED_INFECTION_TRACKING:-false}
      STATIC_ROOT: /tmp/staticfiles
      ALLOWED_HOSTS: "localhost,127.0.0.1,host.docker.internal,backend"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - .:/app
      - media_data:/app/media

  celery:
    build: .
    restart: unless-stopped
    command: sh -c "mkdir -p /tmp/staticfiles /app/media && celery -A config worker --loglevel=info --uid=app --gid=app"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      AUTO_SEED_INFECTION_TRACKING: ${AUTO_SEED_INFECTION_TRACKING:-false}
      STATIC_ROOT: /tmp/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - .:/app
      - media_data:/app/media

volumes:
  postgres_data:
  media_data:
  neo4j_data:
