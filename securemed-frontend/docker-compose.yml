services:
  frontend:
    build:
      context: .
      args:
        - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    extra_hosts:
      - "host.docker.internal:host-gateway"
